name: GoReleaser

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  goreleaser:
    permissions:
      contents: write
    uses: matt-riley/matt-riley-ci/.github/workflows/go-goreleaser.yml@f846763f763247cb0140e3dd08002280b001f6cf # v4.2.0
    with:
      environment: release
      tap-app-id: ${{ vars.APP_ID }}
    secrets:
      github-token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      private-key: ${{ secrets.PRIVATE_KEY }}
      homebrew-tap-token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
