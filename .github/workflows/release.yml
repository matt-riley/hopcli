name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}:${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: matt-riley/matt-riley-ci/.github/workflows/release-please.yml@d903a20396dce0f98960a8c9ea96848349682540 # v4.2.0
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  dispatch-goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: read
      actions: write
    uses: matt-riley/matt-riley-ci/.github/workflows/release-please-dispatch.yml@d903a20396dce0f98960a8c9ea96848349682540 # v4.2.0
    with:
      release-created: ${{ needs.release-please.outputs.release_created }}
      tag: ${{ needs.release-please.outputs.tag_name }}
      workflow: goreleaser.yml
    secrets:
      release-token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
