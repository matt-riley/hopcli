name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Verify module dependencies
        run: go mod verify
      - name: Check go mod tidy
        run: go mod tidy -diff

  ci:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:ci
      cancel-in-progress: true
    needs: verify
    uses: matt-riley/matt-riley-ci/.github/workflows/ci.yml@e802c1e932579d1e840f6dd4f8316458d1f96983 # v4
    with:
      test: true
      lint: true
      vet: true
      fmt: true

  coverage:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Run tests with coverage
        run: go test -coverprofile=cover.out ./...
      - name: Report coverage
        run: go tool cover -func=cover.out
      - name: Enforce coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=cover.out | grep total | awk '{print $3}' | sed 's/%//')
          THRESHOLD=71
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "ERROR: Coverage $COVERAGE% is below threshold $THRESHOLD%"
            exit 1
          fi
          echo "Coverage $COVERAGE% meets threshold $THRESHOLD%"

  govulncheck:
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}:${{ github.ref }}:govulncheck
      cancel-in-progress: true
    needs: ci
    if: ${{ always() }}
    uses: matt-riley/matt-riley-ci/.github/workflows/go-security.yml@e802c1e932579d1e840f6dd4f8316458d1f96983 # v4
    with:
      # v1.1.4's bundled x/tools cannot parse Go 1.27 sources
      # (panic: unexpected expr: *ast.KeyValueExpr)
      govulncheck-version: v1.9.0
